<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Beam Receiver</title>
  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <link rel="stylesheet" href="receiver.css">
</head>
<body>
  <video id="video"></video>

  <div id="subs" aria-live="off"></div>

  <!-- Centre flash for play / pause -->
  <div id="flash"><svg viewBox="0 0 24 24"><path id="flashIcon" fill="#fff" d=""/></svg></div>

  <!-- Buffering ring -->
  <div id="spinner"><div class="ring"></div><div class="label" id="spinLabel">Buffering</div></div>

  <!-- On-screen display -->
  <div id="hud">
    <div class="meta">
      <div class="art" id="art"></div>
      <div class="text">
        <div class="chips" id="chips"></div>
        <div class="title" id="title"></div>
        <div class="sub" id="subtitle"></div>
      </div>
      <div class="state" id="state"></div>
    </div>
    <div class="bar" id="bar">
      <div class="buffered" id="buffered"></div>
      <div class="played" id="played"><div class="knob"></div></div>
    </div>
    <div class="times">
      <span id="pos">0:00</span>
      <span id="ends"></span>
      <span id="dur">0:00</span>
    </div>
  </div>

  <div id="idle">
    <div class="glow"></div>
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24"><path fill="#fff" d="M21,3H3C1.9,3 1,3.9 1,5v3h2V5h18v14h-7v2h7c1.1,0 2,-0.9 2,-2V5C23,3.9 22.1,3 21,3zM1,18v3h3C4,19.34 2.66,18 1,18zM1,14v2c2.76,0 5,2.24 5,5h2C8,17.13 4.87,14 1,14zM1,10v2c4.97,0 9,4.030 9,9h2C12,14.92 7.07,10 1,10z"/></svg>
      </div>
      <div class="name">Beam</div>
    </div>
    <div class="clock" id="clock"></div>
    <div class="hint" id="hint">Ready. Pick a video on your phone.</div>
  </div>

  <div id="toast"></div>

  <script src="receiver.js"></script>
</body>
</html>
